<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeKan Go — compatibility preview</title>
<style>body{font:1rem system-ui,sans-serif;max-width:45rem;margin:3rem auto;padding:1rem;background:#f5f6f7;color:#222}input,button{font:inherit;padding:.6rem;margin:.3rem 0}label{display:block}button{cursor:pointer;background:#176a99;color:white;border:0;border-radius:.2rem}article{padding:1rem;background:white;border-radius:.4rem}#status{white-space:pre-wrap}</style>
<h1>WeKan Go</h1><p>Compatibility preview. Sign in with an existing local account to read a board. Board editing and the full WeKan interface are still being ported.</p>
<form id="login"><label>Username <input name="username" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form>
<form id="board" hidden><label>Board ID <input name="boardId" required></label><button>Open board</button></form>
<p id="status" role="status" aria-live="polite"></p><article id="result" hidden><h2 id="title"></h2><p id="description"></p></article>
<script>
let token;
const status=document.querySelector('#status');
// Keep this preview's session only in memory; never persist a bearer credential.
const base=location.pathname.replace(/\/(?:sign-in)?$/, '');
async function request(path,options={}){const response=await fetch(base+path,options);const data=await response.json();if(!response.ok)throw Error(data.reason||data.error||'Request failed');return data;}
document.querySelector('#login').onsubmit=async event=>{event.preventDefault();status.textContent='Signing in…';try{const form=new FormData(event.target);const data=await request('/users/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(form))});token=data.token;event.target.reset();event.target.hidden=true;document.querySelector('#board').hidden=false;status.textContent='Signed in.';}catch(error){status.textContent=error.message;}};
document.querySelector('#board').onsubmit=async event=>{event.preventDefault();try{const id=new FormData(event.target).get('boardId');const board=await request('/api/boards/'+encodeURIComponent(id),{headers:{Authorization:'Bearer '+token}});document.querySelector('#title').textContent=board.title||'';document.querySelector('#description').textContent=board.description||'';document.querySelector('#result').hidden=false;status.textContent='Board loaded.';}catch(error){document.querySelector('#result').hidden=true;status.textContent=error.message;}};
</script></html>
